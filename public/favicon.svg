<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Rounded Icon Container -->
  <rect width="64" height="64" rx="16" fill="url(#grad)" />

  <!-- Graduation Cap (Mortarboard) -->
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Cap Top Rhombus -->
    <polygon points="32,14 54,24 32,34 10,24" />
    <!-- Cap Skull Base -->
    <path d="M19,28.5 L19,39 C19,45 45,45 45,39 L45,28.5 C40,32 24,32 19,28.5 Z" />
    <!-- Tassel String and Pendant -->
    <path d="M47,25.5 L49,36" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <circle cx="49" cy="38" r="2.5" fill="#fbbf24" />
  </g>
</svg>